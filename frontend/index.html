<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna tagasiset | Õppeainete tagasiside</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a class="logo" href="index.html">📝 Õppeainete tagasiside</a>
      <div class="nav-links">
        <a href="index.html" class="active">Anna tagasisidet</a>
        <a href="ylevaade.html">Ülevaade</a>
      </div>
    </nav>
  </header>

  <main class="narrow">
    <!-- 1. Tagasiside vorm -->
    <section id="form-view">
      <h1>Anna tagasisidet</h1>
      <p class="lead">Hinda läbitud õppeainet. Tärniga <span class="req">*</span> väljad on kohustuslikud.</p>

      <form id="feedback-form" class="card" novalidate>
        <div id="form-errors" class="alert alert-error hidden" role="alert" tabindex="-1"></div>

        <div class="field" data-field="studentName">
          <label for="studentName">Nimi <span class="req" id="name-req">*</span></label>
          <input type="text" id="studentName" name="studentName" autocomplete="name" maxlength="100" placeholder="nt Mari Maasikas">
          <label class="checkbox"><input type="checkbox" id="anonymous" name="anonymous"> Saada anonüümselt <span class="optional">(nime ei salvestata)</span></label>
          <div class="error-text" id="studentName-error"></div>
        </div>

        <div class="field" data-field="className">
          <label for="className">Klass <span class="req">*</span></label>
          <input type="text" id="className" name="className" maxlength="20" placeholder="nt 10A">
          <div class="error-text" id="className-error"></div>
        </div>

        <div class="field" data-field="subjectId">
          <label for="subjectId">Õppeaine <span class="req">*</span></label>
          <select id="subjectId" name="subjectId">
            <option value="">Vali õppeaine…</option>
          </select>
          <div class="error-text" id="subjectId-error"></div>
        </div>

        <div class="field" data-field="grade">
          <fieldset>
            <legend>Hinne <span class="req">*</span></legend>
            <div class="grade-options">
              <label class="grade-option"><input type="radio" name="grade" value="1"><span>1<small>Väga halb</small></span></label>
              <label class="grade-option"><input type="radio" name="grade" value="2"><span>2<small>Halb</small></span></label>
              <label class="grade-option"><input type="radio" name="grade" value="3"><span>3<small>Rahuldav</small></span></label>
              <label class="grade-option"><input type="radio" name="grade" value="4"><span>4<small>Hea</small></span></label>
              <label class="grade-option"><input type="radio" name="grade" value="5"><span>5<small>Väga hea</small></span></label>
            </div>
          </fieldset>
          <div class="error-text" id="grade-error"></div>
        </div>

        <div class="field" data-field="comment">
          <label for="comment">Kommentaar <span class="optional">(valikuline)</span></label>
          <textarea id="comment" name="comment" maxlength="1000" placeholder="Mis meeldis? Mida võiks paremini teha?"></textarea>
          <div class="hint"><span id="comment-count">0</span>/1000</div>
          <div class="error-text" id="comment-error"></div>
        </div>

        <button type="submit" class="btn btn-block" id="submit-btn">Saada tagasiside</button>
      </form>
    </section>

    <!-- 2. Edukas saatmine -->
    <section id="success-view" class="hidden">
      <div class="card success" role="status">
        <div class="success-icon">✓</div>
        <h1>Aitäh! Tagasiside on salvestatud.</h1>
        <p class="muted">Sinu vastus on andmebaasis ja õpetaja näeb seda ülevaates.</p>
        <dl id="success-summary"></dl>
        <div class="actions">
          <button type="button" class="btn" id="again-btn">Anna veel tagasisidet</button>
          <a class="btn btn-secondary" href="ylevaade.html">Vaata ülevaadet</a>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
